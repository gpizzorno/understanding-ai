# Website built with Quarto (https://quarto.org).
#
# Preview locally:   quarto preview docs
# Build locally:     quarto render docs      (output in docs/_site/)
# Published by .github/workflows/website.yml when docs/ or the notebook changes on main.
#
# The facilitator guide, data, and code are not part of the site: they stay in the repository,
# and pages link to them on GitHub.

project:
  type: website
  output-dir: _site
  resources:
    - assets/

website:
  title: Understanding AI
  description: A Practical Workshop for Humanities and Social Science Researchers
  site-url: https://gpizzorno.github.io/understanding-ai/
  repo-url: https://github.com/gpizzorno/understanding-ai
  page-navigation: true
  bread-crumbs: true
  navbar:
    search: true
    tools:
      - icon: github
        href: https://github.com/gpizzorno/understanding-ai
        aria-label: GitHub repository
  sidebar:
    style: docked
    contents:
      - text: Home
        href: index.qmd
      - section: 'Unit 1: Key Concepts'
        href: unit_1/index.qmd
        contents:
          - text: Basic Concepts
            href: unit_1/basic_concepts.qmd
          - text: 'Activity: Teachable Machine'
            href: unit_1/teachable_machine.qmd
          - section: Model Training
            href: unit_1/model_training.qmd
            contents:
              - text: Evaluation Metrics
                href: unit_1/evaluation_metrics.qmd
          - text: Language Models
            href: unit_1/language_models.qmd
          - text: 'Activity: Hack Merlin'
            href: unit_1/hack_merlin.qmd
          - text: LLM Behaviour
            href: unit_1/llm_behaviour.qmd
      - section: 'Unit 2: Working with LLMs'
        href: unit_2/index.qmd
        contents:
          - text: Prompt Processing
            href: unit_2/prompts.qmd
          - text: Prompting Strategies
            href: unit_2/prompting_strategies.qmd
          - text: 'Activity: Gemini Notebook'
            href: unit_2/gemini_notebook.qmd
          - text: Assessing Reliability
            href: unit_2/assessing_reliability.qmd
          - text: Documenting Your Work
            href: unit_2/documenting_ai_use.qmd
          - text: 'Activity: AI-Assisted Work'
            href: unit_2/ai_assisted_work.qmd
          - text: Acknowledging AI Use
            href: unit_2/acknowledging_ai_use.qmd

format:
  html:
    theme:
      light: cosmo
    grid:
      sidebar-width: 330px
    css: styles.css
    toc: true
    toc-title: On this page
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: false
